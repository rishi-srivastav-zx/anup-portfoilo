<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080706" />
      <stop offset="60%" stop-color="#14100e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="keyLightBeam" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffb356" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#ff8c2b" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#14100e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shadowFalloff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="55%" stop-color="#080706" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#darkBg)" />
  <rect width="1600" height="900" fill="url(#keyLightBeam)" />

  <!-- Lighting Diagram: Window / Practical Key Light -->
  <g transform="translate(140, 180)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="220" height="420" fill="none" stroke="#ffb356" stroke-width="4" stroke-opacity="0.6" />
    <line x1="110" y1="0" x2="110" y2="420" stroke="#ffb356" stroke-width="3" stroke-opacity="0.5" />
    <line x1="0" y1="210" x2="220" y2="210" stroke="#ffb356" stroke-width="3" stroke-opacity="0.5" />
    <!-- Light Rays Emanating -->
    <polygon points="220,50 900,120 700,680 220,380" fill="#ffb356" fill-opacity="0.08" />
  </g>

  <!-- Subject Silhouette (Chiaroscuro Profile) -->
  <g transform="translate(720, 240)">
    <!-- Face / Head Silhouette -->
    <path d="M 120 70 C 180 50 240 80 250 150 C 260 210 240 250 210 280 C 190 300 200 360 240 420 L 50 420 C 60 360 70 310 70 260 C 60 210 70 140 120 70 Z" fill="#1e1815" stroke="#ffb356" stroke-width="2" stroke-opacity="0.6" />
    <!-- High-Contrast Key Rim -->
    <path d="M 120 70 C 180 50 240 80 250 150 C 260 210 240 250 210 280" fill="none" stroke="#ffc57a" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Negative Fill Board (Solid Black 8x8 Solid) -->
  <g transform="translate(1080, 200)">
    <rect x="0" y="0" width="40" height="420" rx="4" fill="#000000" stroke="#f4efe6" stroke-width="1.5" stroke-opacity="0.3" />
    <text x="55" y="210" font-family="monospace" font-size="12" fill="#f4efe6" fill-opacity="0.7" letter-spacing="2" transform="rotate(90 55,210)">8x8 NEGATIVE FILL SOLID</text>
  </g>

  <!-- Dark Overlay For Tonal Falloff -->
  <rect width="1600" height="900" fill="url(#shadowFalloff)" />

  <!-- Technical Overlay Ratios -->
  <g font-family="monospace" font-size="13" fill="#f4efe6" fill-opacity="0.6" letter-spacing="2">
    <text x="100" y="100">KEY-TO-FILL RATIO: 8:1 (3-STOP DEFICIT)</text>
    <text x="100" y="125">CONTRAST MODEL: HIGH CHIAROSCURO</text>
    <text x="1500" y="100" text-anchor="end">MOTIVATED VECTOR: 45° UPSTAGE</text>
    <text x="1500" y="125" text-anchor="end">COLOR TEMP: 3200K PRACTICAL TUNGSTEN</text>
  </g>

  <!-- Subtle Badge -->
  <g transform="translate(100, 780)">
    <rect x="0" y="0" width="360" height="34" rx="4" fill="#012ceb" fill-opacity="0.25" stroke="#012ceb" stroke-width="1" />
    <text x="15" y="22" font-family="monospace" font-size="12" fill="#f4efe6" letter-spacing="3" font-weight="bold">LIGHTING &amp; SHADOW ARCHITECTURE</text>
  </g>
</svg>
